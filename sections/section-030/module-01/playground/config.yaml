# Run Keycloak From The Container Image In Production Mode (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-088-playground-030-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Applies the module's starting workloads (Keycloak in development mode and tester) and waits until Keycloak is ready."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "Starting workloads in the image-demo namespace."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false

# Run A Production Keycloak On PostgreSQL
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-088-capstone-030"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1 and the module's workloads in `runcapstone-demo`"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-088-capstone-030-setup"
      description: "Applies a Deployment in development mode on dev-file with health off and the realm file unmounted"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits for the workloads the reference solution depends on"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-keycloak-ready"
      description: "Confirms the Keycloak pod is ready and /health/ready answers UP"
      type: "file"
      source: "validation/validate-keycloak-ready.sh"
    - name: "validate-production-mode"
      description: "Confirms Keycloak runs `start`, never start-dev, with hostname-strict on"
      type: "file"
      source: "validation/validate-production-mode.sh"
    - name: "validate-issuer-fixed"
      description: "Confirms the inventory realm issuer is http://keycloak:8080/realms/inventory for any Host header"
      type: "file"
      source: "validation/validate-issuer-fixed.sh"
    - name: "validate-db-from-secret"
      description: "Confirms KC_DB is postgres and the credentials come from the keycloak-db Secret"
      type: "file"
      source: "validation/validate-db-from-secret.sh"
    - name: "validate-realm-import"
      description: "Confirms the inventory-realm ConfigMap is mounted at the import folder with --import-realm"
      type: "file"
      source: "validation/validate-realm-import.sh"
    - name: "validate-realms-in-postgres"
      description: "Confirms PostgreSQL holds the master and inventory realms"
      type: "file"
      source: "validation/validate-realms-in-postgres.sh"
    - name: "validate-alice-token"
      description: "Confirms alice gets a token from the inventory realm with the right issuer"
      type: "file"
      source: "validation/validate-alice-token.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - postgres:17-alpine
      - quay.io/keycloak/keycloak:26.8.1

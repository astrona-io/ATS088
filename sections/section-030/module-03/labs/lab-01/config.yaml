# Serve Keycloak Over HTTPS Behind A Reverse Proxy
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-088-lab-030-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1 and the tester pod, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-088-lab-030-03-setup"
      description: "Creates the TLS Secret keycloak-tls with a self-signed certificate for keycloak, keycloak.edge-demo.svc and id.example.test"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-tls-options"
      description: "Confirms the Deployment mounts keycloak-tls, sets both certificate options and KC_PROXY_HEADERS, and keeps start"
      type: "file"
      source: "validation/validate-tls-options.sh"
    - name: "validate-https-issuer"
      description: "Confirms the discovery document answers over HTTPS on port 8443 with the issuer https://id.example.test"
      type: "file"
      source: "validation/validate-https-issuer.sh"
    - name: "validate-service-port"
      description: "Confirms the Service keycloak has the port 8443 named https and the Deployment is available"
      type: "file"
      source: "validation/validate-service-port.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1

# Get Tokens From Keycloak With OAuth 2.0 And OpenID Connect (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-088-playground-010-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Deploy Keycloak 26.8.1 and the tester pod, wait for Keycloak, then create the inventory realm, the user alice and the clients inventory-cli and inventory-reporter."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "Starting workloads (namespace protocols-demo, keycloak-admin Secret, keycloak Deployment and Service, tester client)."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false

# Knowledge check for section 010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats088-010
course_id: ATS088
exam_code: KEYCLOAK
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-010
  title: "OAuth 2.0, OpenID Connect And SAML In Keycloak"
placement:
  position: after
  reading: sections/section-010/capstone/labs/lab-01/question.md
questions:
  - id: ats088-010-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what an identity provider does"
    source_readings:
      - sections/section-010/module-01/course-01-keycloak-in-the-cncf-landscape.md
    prompt: "What does the application do when a user signs in through an identity provider such as Keycloak?"
    options:
      - id: a
        text: "It sends the user to the identity provider, then checks the signature on the token it gets back and trusts what the token says."
        explanation: "Correct. The identity provider checks the password. The application only checks the signature on the token."
      - id: b
        text: "It collects the user's password and passes it to Keycloak to check."
        explanation: "Not correct. The application never sees the password. The user types it into Keycloak."
      - id: c
        text: "It asks Keycloak for the stored password hash and compares it itself."
        explanation: "Not correct. Keycloak does not hand password hashes to applications."
      - id: d
        text: "It creates a new session on Keycloak for every request the user makes."
        explanation: "Not correct. The application checks the token. It does not open a session on Keycloak for each request."
    correct_option: a
    explanation: "Correct. The identity provider checks the password. The application only checks the signature on the token."

  - id: ats088-010-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Tell the CNCF identity projects apart"
    source_readings:
      - sections/section-010/module-01/course-01-keycloak-in-the-cncf-landscape.md
    prompt: "Which CNCF project gives services, not people, a cryptographic identity?"
    options:
      - id: a
        text: "Keycloak."
        explanation: "Not correct. Keycloak identifies people, and the service accounts of its clients."
      - id: b
        text: "SPIFFE and SPIRE."
        explanation: "Correct. SPIFFE and SPIRE identify workloads."
      - id: c
        text: "Dex."
        explanation: "Not correct. Dex is an OpenID Connect provider that connects to other identity providers."
      - id: d
        text: "Open Policy Agent."
        explanation: "Not correct. Open Policy Agent is a policy engine that decides on a request."
    correct_option: b
    explanation: "Correct. SPIFFE and SPIRE identify workloads."

  - id: ats088-010-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the grant type for a job with no user"
    source_readings:
      - sections/section-010/module-01/course-02-oauth2-and-the-client-credentials-grant.md
    prompt: "A nightly job has no signed-in user and needs a token for itself. Which grant type does it use?"
    options:
      - id: a
        text: "`authorization_code`."
        explanation: "Not correct. This grant needs a user who signs in through the browser."
      - id: b
        text: "`password`."
        explanation: "Not correct. It sends a user's password, and the job has no user. OAuth 2.1 also drops it."
      - id: c
        text: "`client_credentials`."
        explanation: "Correct. The token is about the client itself, through its service account."
      - id: d
        text: "`refresh_token`."
        explanation: "Not correct. It needs a refresh token from an earlier grant. It is not a first grant."
    correct_option: c
    explanation: "Correct. The token is about the client itself, through its service account."

  - id: ats088-010-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tell public and confidential clients apart"
    source_readings:
      - sections/section-010/module-01/course-02-oauth2-and-the-client-credentials-grant.md
    prompt: "Why does Keycloak refuse the `client_credentials` grant for the public client `inventory-cli`?"
    options:
      - id: a
        text: "The grant is turned off for the whole realm `inventory`."
        explanation: "Not correct. The confidential client `inventory-reporter` uses the same grant in the same realm."
      - id: b
        text: "The token endpoint accepts this grant only from the `master` realm."
        explanation: "Not correct. The grant works in any realm for a confidential client."
      - id: c
        text: "A public client may only use the SAML protocol."
        explanation: "Not correct. The protocol is a setting of the client, and `inventory-cli` uses `openid-connect`."
      - id: d
        text: "A public client cannot keep a secret and has no service account, so it cannot prove who it is."
        explanation: "Correct. The client credentials grant needs a confidential client."
    correct_option: d
    explanation: "Correct. The client credentials grant needs a confidential client."

  - id: ats088-010-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the claims of an access token"
    source_readings:
      - sections/section-010/module-01/course-02-oauth2-and-the-client-credentials-grant.md
    prompt: "In an access token from the client credentials grant for `inventory-reporter`, which claim holds `inventory-reporter`?"
    options:
      - id: a
        text: "`iss`, the issuer."
        explanation: "Not correct. `iss` is the URL of the realm that signed the token."
      - id: b
        text: "`typ`, the token type."
        explanation: "Not correct. `typ` names the kind of token, for example `Bearer`."
      - id: c
        text: "`azp`, the authorized party."
        explanation: "Correct. `azp` names the client that asked for the token."
      - id: d
        text: "`exp`, the expiry time."
        explanation: "Not correct. `exp` is the time the token expires, in seconds since 1970."
    correct_option: c
    explanation: "Correct. `azp` names the client that asked for the token."

  - id: ats088-010-q06
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what the openid scope does"
    source_readings:
      - sections/section-010/module-01/course-03-openid-connect-and-the-id-token.md
    prompt: "A password grant request returns an access token but no `id_token`. What is missing from the request?"
    options:
      - id: a
        text: "`scope=openid`."
        explanation: "Correct. Without the `openid` scope the request is plain OAuth 2.0."
      - id: b
        text: "`grant_type=id_token`."
        explanation: "Not correct. There is no such grant type. The grant stays the same."
      - id: c
        text: "A `client_secret` for the public client."
        explanation: "Not correct. A public client has no secret. The scope decides if there is an ID token."
      - id: d
        text: "The `Authorization: Bearer` header."
        explanation: "Not correct. That header is for calling an API or the UserInfo endpoint, not for the token endpoint."
    correct_option: a
    explanation: "Correct. Without the `openid` scope the request is plain OAuth 2.0."

  - id: ats088-010-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why the issuer must match"
    source_readings:
      - sections/section-010/module-01/course-03-openid-connect-and-the-id-token.md
    prompt: "An API expects the issuer `http://keycloak:8080/realms/inventory` but refuses a token issued at `http://localhost:8080/realms/inventory`. Why?"
    options:
      - id: a
        text: "The two URLs belong to two different realms with different users."
        explanation: "Not correct. Both URLs name the realm `inventory`. Only the host name differs."
      - id: b
        text: "The token is expired because `localhost` has a different clock."
        explanation: "Not correct. Expiry is the `exp` claim, and it does not depend on the host name."
      - id: c
        text: "Keycloak signs tokens from `localhost` with a key the realm does not publish."
        explanation: "Not correct. The realm signs with its own keys whatever host name is used."
      - id: d
        text: "The issuer follows the host name the client used, and the API refuses a token whose `iss` is not the one it expects."
        explanation: "Correct. Two host names give two different issuers for the same realm."
    correct_option: d
    explanation: "Correct. Two host names give two different issuers for the same realm."

  - id: ats088-010-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Check a token signature with the realm keys"
    source_readings:
      - sections/section-010/module-01/course-03-openid-connect-and-the-id-token.md
    prompt: "How does an API check the signature of a token without calling Keycloak for every request?"
    options:
      - id: a
        text: "It sends the token to the UserInfo endpoint on every request."
        explanation: "Not correct. UserInfo works, but it is a call to Keycloak, which is what the API avoids."
      - id: b
        text: "It gets the public keys once from `jwks_uri` and picks the key named by the `kid` in the token header."
        explanation: "Correct. The `kid` in the header names the signing key."
      - id: c
        text: "It uses the client secret of the client as the signing key."
        explanation: "Not correct. Tokens are signed with the realm's key pair, for example `RS256`."
      - id: d
        text: "It decodes the payload and trusts the `iss` claim."
        explanation: "Not correct. Anyone can write an `iss` claim. The signature proves who issued the token."
    correct_option: b
    explanation: "Correct. The `kid` in the header names the signing key."

  - id: ats088-010-q09
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain how SAML 2.0 delivers an assertion"
    source_readings:
      - sections/section-010/module-01/course-04-saml-and-choosing-a-protocol.md
    prompt: "In a SAML 2.0 sign-in, how does the signed assertion reach the service provider?"
    options:
      - id: a
        text: "Keycloak sends it through the user's browser, usually in an HTML form that the browser posts."
        explanation: "Correct. The assertion travels through the browser, not straight from server to server."
      - id: b
        text: "Keycloak calls the service provider directly over a back channel."
        explanation: "Not correct. The flow uses the browser as the carrier."
      - id: c
        text: "The service provider requests it from the token endpoint with a client secret."
        explanation: "Not correct. SAML has no token endpoint. That is OAuth 2.0."
      - id: d
        text: "The user copies the assertion into the application by hand."
        explanation: "Not correct. The browser posts the form without any action from the user."
    correct_option: a
    explanation: "Correct. The assertion travels through the browser, not straight from server to server."

  - id: ats088-010-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a protocol for a new application"
    source_readings:
      - sections/section-010/module-01/course-04-saml-and-choosing-a-protocol.md
    prompt: "A new web application must also call an API with an access token. Which protocol does the course rule choose?"
    options:
      - id: a
        text: "SAML 2.0, because it is the older and more tested standard."
        explanation: "Not correct. SAML has no token for APIs."
      - id: b
        text: "SAML 2.0, because it signs with XML Signature."
        explanation: "Not correct. The signature format does not decide, and SAML gives no API token."
      - id: c
        text: "OpenID Connect, because only OAuth 2.0 and OpenID Connect give the application an access token."
        explanation: "Correct. Use SAML only when the application supports nothing else."
      - id: d
        text: "Either one, because the format of the assertion does not matter to an API."
        explanation: "Not correct. An API needs an access token, and SAML does not provide one."
    correct_option: c
    explanation: "Correct. Use SAML only when the application supports nothing else."

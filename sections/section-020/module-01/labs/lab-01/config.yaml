# Create An Application Realm With kcadm.sh
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-088-lab-020-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1 in development mode and the tester pod into realms-demo"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-088-lab-020-01-setup"
      description: "Checks the starting state in `realms-demo`: only the master realm exists"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until the bootstrap administrator can sign in before running kcadm.sh"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The commands a correct learner runs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-realm-enabled"
      description: "Confirms the realm inventory exists and is enabled"
      type: "file"
      source: "validation/validate-realm-enabled.sh"
    - name: "validate-client-settings"
      description: "Confirms inventory-cli is a public client with direct access grants on and the standard flow off"
      type: "file"
      source: "validation/validate-client-settings.sh"
    - name: "validate-user-token"
      description: "Confirms alice gets a token from the inventory realm with the right issuer"
      type: "file"
      source: "validation/validate-user-token.sh"
    - name: "validate-master-clean"
      description: "Confirms the master realm holds no client inventory-cli and no user alice"
      type: "file"
      source: "validation/validate-master-clean.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1

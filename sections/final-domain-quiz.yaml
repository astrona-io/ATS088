# Final domain quiz. Listed in astrona.yaml as the last `type: quiz` entry.
schema_version: 1
kind: question_bank
id: ats088-final
course_id: ATS088
exam_code: KEYCLOAK
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: fundamentals-and-getting-started
  title: "Keycloak: Fundamentals & Getting Started"
placement:
  position: after
  reading: sections/section-030/capstone/labs/lab-01/question.md
questions:
  - id: ats088-final-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what an identity provider does"
    source_readings:
      - sections/section-010/module-01/course-01-keycloak-in-the-cncf-landscape.md
    prompt: "What does the application do when a user signs in through an identity provider such as Keycloak?"
    options:
      - id: a
        text: "It sends the user to the identity provider, then checks the signature on the token it gets back and trusts what the token says."
        explanation: "Correct. The identity provider checks the password. The application only checks the signature on the token."
      - id: b
        text: "It collects the user's password and passes it to Keycloak to check."
        explanation: "Not correct. The application never sees the password. The user types it into Keycloak."
      - id: c
        text: "It asks Keycloak for the stored password hash and compares it itself."
        explanation: "Not correct. Keycloak does not hand password hashes to applications."
      - id: d
        text: "It creates a new session on Keycloak for every request the user makes."
        explanation: "Not correct. The application checks the token. It does not open a session on Keycloak for each request."
    correct_option: a
    explanation: "Correct. The identity provider checks the password. The application only checks the signature on the token."

  - id: ats088-final-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tell public and confidential clients apart"
    source_readings:
      - sections/section-010/module-01/course-02-oauth2-and-the-client-credentials-grant.md
    prompt: "Why does Keycloak refuse the `client_credentials` grant for the public client `inventory-cli`?"
    options:
      - id: a
        text: "The grant is turned off for the whole realm `inventory`."
        explanation: "Not correct. The confidential client `inventory-reporter` uses the same grant in the same realm."
      - id: b
        text: "A public client cannot keep a secret and has no service account, so it cannot prove who it is."
        explanation: "Correct. The client credentials grant needs a confidential client."
      - id: c
        text: "The token endpoint accepts this grant only from the `master` realm."
        explanation: "Not correct. The grant works in any realm for a confidential client."
      - id: d
        text: "A public client may only use the SAML protocol."
        explanation: "Not correct. The protocol is a setting of the client, and `inventory-cli` uses `openid-connect`."
    correct_option: b
    explanation: "Correct. The client credentials grant needs a confidential client."

  - id: ats088-final-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a protocol for a new application"
    source_readings:
      - sections/section-010/module-01/course-04-saml-and-choosing-a-protocol.md
    prompt: "A new web application must also call an API with an access token. Which protocol does the course rule choose?"
    options:
      - id: a
        text: "SAML 2.0, because it is the older and more tested standard."
        explanation: "Not correct. SAML has no token for APIs."
      - id: b
        text: "SAML 2.0, because it signs with XML Signature."
        explanation: "Not correct. The signature format does not decide, and SAML gives no API token."
      - id: c
        text: "OpenID Connect, because only OAuth 2.0 and OpenID Connect give the application an access token."
        explanation: "Correct. Use SAML only when the application supports nothing else."
      - id: d
        text: "Either one, because the format of the assertion does not matter to an API."
        explanation: "Not correct. An API needs an access token, and SAML does not provide one."
    correct_option: c
    explanation: "Correct. Use SAML only when the application supports nothing else."

  - id: ats088-final-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know when the bootstrap variables take effect"
    source_readings:
      - sections/section-020/module-01/course-01-the-master-realm-and-the-bootstrap-admin.md
    prompt: "You change the Secret `keycloak-admin` and restart the pod. The database already holds the realm `master`. What happens to the administrator password?"
    options:
      - id: a
        text: "Keycloak sets the new password at the restart."
        explanation: "Not correct. An existing administrator is not changed."
      - id: b
        text: "Keycloak refuses to start until the old password is removed."
        explanation: "Not correct. It starts, and it logs an error."
      - id: c
        text: "Keycloak creates a second administrator with the new password."
        explanation: "Not correct. No second user is created."
      - id: d
        text: "It stays the same. Keycloak logs an error and starts anyway."
        explanation: "Correct. The variables only matter when `master` does not exist yet."
    correct_option: d
    explanation: "Correct. The variables only matter when `master` does not exist yet."

  - id: ats088-final-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "Know what a new realm contains"
    source_readings:
      - sections/section-020/module-01/course-02-what-a-realm-holds.md
    prompt: "You create the realm `demo` and open **Clients**. What do you see?"
    options:
      - id: a
        text: "Built-in clients such as `account`, `account-console`, `admin-cli` and `security-admin-console`."
        explanation: "Correct. A new realm is not empty. It also has signing keys."
      - id: b
        text: "An empty list."
        explanation: "Not correct. Keycloak creates built-in clients when it creates the realm."
      - id: c
        text: "A copy of every client in `master`."
        explanation: "Not correct. Clients belong to one realm and are not copied."
      - id: d
        text: "Only the client `inventory-cli`."
        explanation: "Not correct. That client exists only if you create it."
    correct_option: a
    explanation: "Correct. A new realm is not empty. It also has signing keys."

  - id: ats088-final-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why realms are isolated"
    source_readings:
      - sections/section-020/module-01/course-02-what-a-realm-holds.md
    prompt: "Why can a token signed by the realm `demo` not pass a signature check against the keys of `master`?"
    options:
      - id: a
        text: "Both realms share one key, but `demo` signs with a different algorithm."
        explanation: "Not correct. Realms do not share keys."
      - id: b
        text: "Each realm signs with its own key pairs, so the `kid` values differ."
        explanation: "Correct. An API that trusts one issuer rejects tokens from every other realm."
      - id: c
        text: "The realm `demo` does not sign its tokens."
        explanation: "Not correct. Every realm signs its tokens."
      - id: d
        text: "Tokens from other realms expire at once."
        explanation: "Not correct. Expiry is the `exp` claim and is not tied to the realm of the checker."
    correct_option: b
    explanation: "Correct. An API that trusts one issuer rejects tokens from every other realm."

  - id: ats088-final-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know which configuration source wins"
    source_readings:
      - sections/section-030/module-01/course-02-configuration-sources-and-build-options.md
    prompt: "`KC_DB_URL_HOST=postgres-a` is set in `env` and `--db-url-host=postgres-b` is set in `args`. Which host does Keycloak use?"
    options:
      - id: a
        text: "`postgres-a`, because environment variables win over command-line options."
        explanation: "Not correct. The order is command line, environment variable, `keycloak.conf`, key store."
      - id: b
        text: "Keycloak fails to start because the two values differ."
        explanation: "Not correct. It uses the winner and does not report the other one."
      - id: c
        text: "`postgres-b`, because a command-line option wins over an environment variable."
        explanation: "Correct. If a change in `env` does nothing, look in `args` first."
      - id: d
        text: "Keycloak tries both hosts in turn."
        explanation: "Not correct. It uses one value."
    correct_option: c
    explanation: "Correct. If a change in `env` does nothing, look in `args` first."

  - id: ats088-final-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain what hostname-strict protects"
    source_readings:
      - sections/section-030/module-01/course-03-production-mode-hostname-and-health.md
    prompt: "With a hostname set and `hostname-strict` at `true`, a request arrives with the header `Host: localhost:8080`. Which issuer does Keycloak use?"
    options:
      - id: a
        text: "`http://localhost:8080/realms/master`, from the `Host` header."
        explanation: "Not correct. That is how development mode behaves."
      - id: b
        text: "No issuer. Keycloak answers `404`."
        explanation: "Not correct. The request is answered with the fixed hostname."
      - id: c
        text: "Both issuers, in a list."
        explanation: "Not correct. A token has one issuer."
      - id: d
        text: "The configured hostname. Keycloak ignores the `Host` header of the request."
        explanation: "Correct. This stops a client from choosing the hostname in tokens and links."
    correct_option: d
    explanation: "Correct. This stops a client from choosing the hostname in tokens and links."

  - id: ats088-final-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain what a startup import does to an existing realm"
    source_readings:
      - sections/section-030/module-02/course-02-importing-and-exporting-a-realm.md
    prompt: "You edit the realm file in the ConfigMap and restart Keycloak with `--import-realm`. The realm already exists in PostgreSQL. What changes in the realm?"
    options:
      - id: a
        text: "Nothing. A startup import skips a realm that already exists."
        explanation: "Correct. A startup import creates a missing realm. It is not a sync."
      - id: b
        text: "Keycloak updates the realm to match the file."
        explanation: "Not correct. It never updates an existing realm."
      - id: c
        text: "Keycloak deletes the realm and creates it again."
        explanation: "Not correct. It deletes nothing."
      - id: d
        text: "Keycloak fails to start because the realm exists."
        explanation: "Not correct. It starts and skips the realm."
    correct_option: a
    explanation: "Correct. A startup import creates a missing realm. It is not a sync."

  - id: ats088-final-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain exact redirect URIs"
    source_readings:
      - sections/section-010/module-02/course-02-pkce-and-exact-redirect-uris.md
    prompt: "Why must a client list the full callback URL as its redirect URI instead of `*`?"
    options:
      - id: a
        text: "Keycloak cannot store a wildcard."
        explanation: "Not correct. Keycloak accepts wildcards, which is why they are dangerous."
      - id: b
        text: "A wildcard turns off PKCE."
        explanation: "Not correct. The two settings are independent."
      - id: c
        text: "A wildcard lets any address receive an authorization code."
        explanation: "Correct. Keycloak sends the code to any address that matches the list."
      - id: d
        text: "A wildcard makes the token endpoint slower."
        explanation: "Not correct. Speed is not the issue."
    correct_option: c
    explanation: "Correct. Keycloak sends the code to any address that matches the list."

  - id: ats088-final-q11
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain refresh token rotation"
    source_readings:
      - sections/section-010/module-02/course-04-refresh-tokens-lifespans-and-sessions.md
    prompt: "A realm has `revokeRefreshToken` on. What happens when a client sends the same refresh token twice?"
    options:
      - id: a
        text: "Keycloak deletes the user."
        explanation: "Not correct. Users are not deleted."
      - id: b
        text: "Keycloak turns off the client."
        explanation: "Not correct. Clients are not turned off."
      - id: c
        text: "The second request fails with `invalid_grant`."
        explanation: "Correct. Each refresh returns a new refresh token and the old one stops working."
      - id: d
        text: "Both requests succeed."
        explanation: "Not correct. That is the behaviour with rotation off."
    correct_option: c
    explanation: "Correct. Each refresh returns a new refresh token and the old one stops working."

  - id: ats088-final-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain what realm-management holds"
    source_readings:
      - sections/section-020/module-02/course-03-administration-roles-and-least-privilege.md
    prompt: "What does the client `realm-management` hold?"
    options:
      - id: a
        text: "The signing keys of the realm."
        explanation: "Not correct. Keys are realm settings."
      - id: b
        text: "The Admin Console pages."
        explanation: "Not correct. The console is a different client."
      - id: c
        text: "The client roles that control the Admin REST API of the realm."
        explanation: "Correct. Roles such as view-users and manage-users belong to it."
      - id: d
        text: "The users of the realm."
        explanation: "Not correct. Users belong to the realm."
    correct_option: c
    explanation: "Correct. Roles such as view-users and manage-users belong to it."

  - id: ats088-final-q13
    type: single_choice
    difficulty: advanced
    learning_objective: "Apply least privilege to a service account"
    source_readings:
      - sections/section-020/module-02/course-03-administration-roles-and-least-privilege.md
    prompt: "A tool must only read users. Which assignment is correct?"
    options:
      - id: a
        text: "Give its service account realm-admin."
        explanation: "Not correct. realm-admin allows everything in the realm."
      - id: b
        text: "Give its service account manage-users."
        explanation: "Not correct. manage-users also changes and deletes users."
      - id: c
        text: "Give the tool the master administrator password."
        explanation: "Not correct. That gives the tool control of every realm."
      - id: d
        text: "Give its service account the client role view-users of realm-management."
        explanation: "Correct. It allows reading users and nothing more."
    correct_option: d
    explanation: "Correct. It allows reading users and nothing more."

  - id: ats088-final-q14
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain the fixed hostname"
    source_readings:
      - sections/section-030/module-03/course-03-reverse-proxy-headers.md
    prompt: "A server has `KC_HOSTNAME=https://id.example.test` and `KC_PROXY_HEADERS=xforwarded`. A request sends `X-Forwarded-Host: other.example.test`. Which issuer does the discovery document show?"
    options:
      - id: a
        text: "No issuer"
        explanation: "Not correct. The document always has an issuer."
      - id: b
        text: "https://id.example.test/realms/master"
        explanation: "Correct. The fixed URL decides the issuer."
      - id: c
        text: "https://other.example.test/realms/master"
        explanation: "Not correct. A fixed hostname wins over the header."
      - id: d
        text: "http://keycloak:8080/realms/master"
        explanation: "Not correct. That is the address of the request, not the fixed URL."
    correct_option: b
    explanation: "Correct. The fixed URL decides the issuer."

  - id: ats088-final-q15
    type: single_choice
    difficulty: advanced
    learning_objective: "Diagnose a failing start"
    source_readings:
      - sections/section-030/module-03/course-04-troubleshooting-tls-and-proxy-problems.md
    prompt: "A pod restarts after you mounted the Secret and its log names a certificate path. What do you compare first?"
    options:
      - id: a
        text: "The user password with the policy"
        explanation: "Not correct. Users are not involved in the start."
      - id: b
        text: "The Service port with the node port"
        explanation: "Not correct. The Service does not affect the start of the pod."
      - id: c
        text: "The option paths with the volume mount path and the Secret key names"
        explanation: "Correct. A path that differs by one directory is the most common cause."
      - id: d
        text: "The realm name with the client id"
        explanation: "Not correct. Those do not affect the certificate load."
    correct_option: c
    explanation: "Correct. A path that differs by one directory is the most common cause."

  - id: ats088-final-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "List the claims to check"
    source_readings:
      - sections/section-010/module-03/course-02-claims-a-resource-server-must-check.md
    prompt: "Which claim stops a token issued for service A from being replayed against service B?"
    options:
      - id: a
        text: "aud"
        explanation: "Correct. The API checks that aud lists its own identifier."
      - id: b
        text: "iat"
        explanation: "Not correct. iat is the time of issue."
      - id: c
        text: "typ"
        explanation: "Not correct. typ is the token type."
      - id: d
        text: "jti"
        explanation: "Not correct. jti is a unique token id."
    correct_option: a
    explanation: "Correct. The API checks that aud lists its own identifier."

  - id: ats088-final-q17
    type: single_choice
    difficulty: advanced
    learning_objective: "Choose a validation method"
    source_readings:
      - sections/section-010/module-03/course-03-token-introspection.md
    prompt: "An API must stop access as soon as a user logs out. Which check does that?"
    options:
      - id: a
        text: "Introspection, which returns active false"
        explanation: "Correct. Introspection sees the current session."
      - id: b
        text: "Checking the signature only"
        explanation: "Not correct. The signature stays valid until exp."
      - id: c
        text: "Checking iss only"
        explanation: "Not correct. iss does not change at logout."
      - id: d
        text: "Checking exp only"
        explanation: "Not correct. exp does not change at logout."
    correct_option: a
    explanation: "Correct. Introspection sees the current session."

  - id: ats088-final-q18
    type: single_choice
    difficulty: beginner
    learning_objective: "Find the management port"
    source_readings:
      - sections/section-030/module-04/course-02-metrics-on-the-management-port.md
    prompt: "On which port does Keycloak serve /metrics and /health?"
    options:
      - id: a
        text: "9000"
        explanation: "Correct. The management interface listens on 9000."
      - id: b
        text: "8080"
        explanation: "Not correct. That is the main HTTP port."
      - id: c
        text: "8443"
        explanation: "Not correct. That is the usual HTTPS port."
      - id: d
        text: "5432"
        explanation: "Not correct. That is a database port."
    correct_option: a
    explanation: "Correct. The management interface listens on 9000."

  - id: ats088-final-q19
    type: single_choice
    difficulty: advanced
    learning_objective: "Diagnose a silent restart"
    source_readings:
      - sections/section-030/module-04/course-03-memory-resources-and-restarts.md
    prompt: "A pod restarts and its log ends without an error. Which field shows the likely cause?"
    options:
      - id: a
        text: "lastState with reason OOMKilled"
        explanation: "Correct. The kernel ends the process, so the log has no message."
      - id: b
        text: "the Service type"
        explanation: "Not correct. A Service does not restart pods."
      - id: c
        text: "the image tag"
        explanation: "Not correct. The tag does not explain a restart."
      - id: d
        text: "the realm name"
        explanation: "Not correct. The realm is unrelated."
    correct_option: a
    explanation: "Correct. The kernel ends the process, so the log has no message."
